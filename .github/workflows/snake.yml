name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2496FF&color_dots=#161B22,#1A304D,#1B5A91,#1D78C8,#2496FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2496FF&color_dots=#161B22,#1A304D,#1B5A91,#1D78C8,#2496FF

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
